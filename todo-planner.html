<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planner Tugas</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#CCDBDC;--card:#f4f9f9;--ink:#003249;--mute:#4a6c78;--line:#9AD1D4;--acc:#007EA7;--hl:#80CED7;--ok:#13806a;--bad:#c8553d;color-scheme:light}
:root[data-theme=dark]{--bg:#00212f;--card:#003249;--ink:#CCDBDC;--mute:#9AD1D4;--line:#0b5473;--acc:#80CED7;--hl:#007EA7;--ok:#5fd6b3;--bad:#ff8a70;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;filter:brightness(var(--b,1));transition:background .25s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line)}
h1{font-size:1.35rem;font-weight:800;letter-spacing:-.02em}
h1 span{background:linear-gradient(transparent 60%,var(--hl) 60%);padding:0 4px}
.tools{display:flex;align-items:center;gap:12px;font-size:.85rem;color:var(--mute)}
.tools input[type=range]{width:110px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-weight:600}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-theme=dark] .btn.pri{color:#003249}
main{display:grid;grid-template-columns:340px 1fr;gap:20px;padding:20px 24px;max-width:1150px;margin:auto}
@media(max-width:820px){main{grid-template-columns:1fr;padding:14px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.side{display:flex;flex-direction:column;gap:20px}
.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.dn{font-size:.72rem;color:var(--mute);padding:4px 0}
.day{position:relative;aspect-ratio:1;border:0;background:none;border-radius:8px;font-size:.85rem;font-weight:600}
.day:hover{background:var(--bg)}
.day.today{box-shadow:inset 0 0 0 2px var(--hl)}
.day.sel{background:var(--acc);color:#fff}
:root[data-theme=dark] .day.sel{color:#003249}
.day .dots{position:absolute;bottom:3px;left:0;right:0;display:flex;justify-content:center;gap:2px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--acc)}
.dots i.d{background:var(--ok)}
.day.sel .dots i{background:currentColor;opacity:.8}
label{display:block;font-size:.78rem;color:var(--mute);margin-bottom:3px;font-weight:600}
.f{display:grid;gap:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=text],input[type=date],input[type=number],select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>b{display:block;height:100%;width:0;background:var(--acc);border-radius:99px;transition:width .3s}
.bar.ok>b{background:var(--ok)}
.dayhead h2{font-size:1.15rem;font-weight:800}
.dayhead p{font-size:.85rem;color:var(--mute);margin:2px 0 10px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.filters>*{flex:1 1 120px;min-width:0}
.list{display:grid;gap:10px}
.t{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;background:var(--card)}
.t.done .ti{text-decoration:line-through;color:var(--mute)}
.t input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok)}
.ti{font-weight:700}
.meta{font-size:.78rem;color:var(--mute)}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--c);color:#fff;font-size:.72rem;font-weight:600;margin-right:6px}
.t .pg{grid-column:1/-1;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.t .pg input{width:100%;accent-color:var(--acc)}
.t .pg span{font-size:.78rem;font-weight:700;min-width:36px;text-align:right}
.acts{display:flex;gap:6px}
.acts .btn{padding:4px 9px;font-size:.8rem}
.empty{text-align:center;color:var(--mute);padding:26px 0}
.alarm .big{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;margin:6px 0}
.alarm .row{margin-bottom:10px}
#ring,#edit{position:fixed;inset:0;background:rgba(10,14,25,.7);display:none;place-items:center;z-index:9}
#ring.on,#edit.on{display:grid}
#edit>.box{background:var(--card);border-radius:16px;padding:22px;width:min(380px,92vw)}
#edit h2{margin-bottom:12px;font-size:1.1rem}
#edit .row2{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
#ring div{background:var(--card);border-radius:16px;padding:28px;text-align:center;max-width:320px}
#ring h2{margin-bottom:6px}
#ring p{color:var(--mute);margin-bottom:16px}
</style>
</head>
<body>
<header>
  <h1><span>Planner</span> Tugas</h1>
  <div class="tools">
    <label for="br" style="margin:0">Kecerahan</label>
    <input type="range" id="br" min="40" max="120" value="100">
    <button class="btn" id="themeBtn"></button>
  </div>
</header>

<main>
  <div class="side">
    <section class="card">
      <div class="calh">
        <button class="btn" id="prev" aria-label="Bulan sebelumnya">‹</button>
        <span id="month"></span>
        <button class="btn" id="next" aria-label="Bulan berikutnya">›</button>
      </div>
      <div class="grid" id="cal"></div>
      <button class="btn" id="goToday" style="width:100%;margin-top:10px">Ke hari ini</button>
    </section>

    <section class="card">
      <div class="f">
        <div><label for="nt">Tugas baru</label><input type="text" id="nt" placeholder="Contoh: Laporan praktikum"></div>
        <div class="row">
          <div><label for="ntype">Tipe</label>
            <select id="ntype"><option>Tugas</option><option>Ujian</option><option>Proyek</option><option>Bacaan</option><option>Lainnya</option></select></div>
          <div><label for="ndur">Durasi (menit)</label><input type="number" id="ndur" min="5" step="5" value="30"></div>
        </div>
        <div><label for="nd">Tanggal</label><input type="date" id="nd"></div>
        <button class="btn pri" id="add">Tambah tugas</button>
      </div>
    </section>

    <section class="card alarm">
      <label>Alarm istirahat</label>
      <div class="row">
        <div><label for="am">Istirahat (menit)</label><input type="number" id="am" min="1" value="5"></div>
        <div style="align-self:end"><button class="btn pri" id="astart" style="width:100%">Mulai</button></div>
      </div>
      <div class="meta" id="albl">Belum ada alarm aktif</div>
      <div class="big" id="cd">--:--</div>
      <button class="btn" id="astop" style="width:100%" disabled>Batalkan</button>
    </section>
  </div>

  <section>
    <div class="card dayhead">
      <h2 id="dt"></h2>
      <p id="ds"></p>
      <div class="bar" id="dbar"><b></b></div>
    </div>
    <div class="filters">
      <select id="fscope" aria-label="Cakupan"><option value="day">Hari terpilih</option><option value="all">Semua hari</option></select>
      <select id="fstat" aria-label="Status"><option value="">Semua status</option><option value="todo">Belum selesai</option><option value="done">Selesai</option></select>
      <select id="ftype" aria-label="Tipe"><option value="">Semua tipe</option><option>Tugas</option><option>Ujian</option><option>Proyek</option><option>Bacaan</option><option>Lainnya</option></select>
      <select id="sort" aria-label="Urutkan"><option value="date">Urut: tanggal</option><option value="dur">Urut: durasi</option><option value="prog">Urut: progres</option><option value="title">Urut: judul</option><option value="type">Urut: tipe</option></select>
    </div>
    <div class="list" id="list"></div>
  </section>
</main>

<div id="edit"><div class="box" role="dialog" aria-label="Edit tugas"><h2>Edit tugas</h2><div class="f">
  <div><label for="et">Judul</label><input type="text" id="et"></div>
  <div class="row">
    <div><label for="etype">Tipe</label><select id="etype"><option>Tugas</option><option>Ujian</option><option>Proyek</option><option>Bacaan</option><option>Lainnya</option></select></div>
    <div><label for="edur">Durasi (menit)</label><input type="number" id="edur" min="5" step="5"></div>
  </div>
  <div><label for="ed">Tanggal</label><input type="date" id="ed"></div>
  <div class="row2"><button class="btn" id="ecancel">Batal</button><button class="btn pri" id="esave">Simpan perubahan</button></div>
</div></div></div>
<div id="ring"><div><h2>⏰ Waktu istirahat habis</h2><p id="rmsg"></p><button class="btn pri" id="rok">Oke, lanjut kerja</button></div></div>

<script>
const $=s=>document.querySelector(s);
const COL={Tugas:'#007EA7',Ujian:'#c8553d',Proyek:'#5c5a9e',Bacaan:'#2a9d8f',Lainnya:'#8a7a2f'};
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=ymd(new Date());
let S={tasks:[],theme:'light',bright:100};
try{const r=localStorage.getItem('planner');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('planner',JSON.stringify(S))}catch(e){}};
let sel=today, vm=new Date(); vm.setDate(1);

/* Tema & kecerahan */
function applyTheme(){
  document.documentElement.dataset.theme=S.theme;
  document.body.style.setProperty('--b',S.bright/100);
  $('#br').value=S.bright;
  $('#themeBtn').textContent=S.theme==='dark'?'☀ Mode terang':'☾ Mode gelap';
}
$('#themeBtn').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';applyTheme();save()};
$('#br').oninput=e=>{S.bright=+e.target.value;applyTheme();save()};

/* Kalender */
function renderCal(){
  $('#month').textContent=BLN[vm.getMonth()]+' '+vm.getFullYear();
  let h=['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(d=>`<div class="dn">${d}</div>`).join('');
  const first=vm.getDay(), n=new Date(vm.getFullYear(),vm.getMonth()+1,0).getDate();
  for(let i=0;i<first;i++)h+='<div></div>';
  for(let d=1;d<=n;d++){
    const key=vm.getFullYear()+'-'+pad(vm.getMonth()+1)+'-'+pad(d);
    const ts=S.tasks.filter(t=>t.date===key);
    const dots=ts.slice(0,3).map(t=>`<i class="${t.prog===100?'d':''}"></i>`).join('');
    h+=`<button class="day${key===today?' today':''}${key===sel?' sel':''}" data-d="${key}">${d}<span class="dots">${dots}</span></button>`;
  }
  $('#cal').innerHTML=h;
}
$('#cal').onclick=e=>{const b=e.target.closest('.day');if(!b)return;sel=b.dataset.d;$('#nd').value=sel;render()};
$('#prev').onclick=()=>{vm.setMonth(vm.getMonth()-1);renderCal()};
$('#next').onclick=()=>{vm.setMonth(vm.getMonth()+1);renderCal()};
$('#goToday').onclick=()=>{sel=today;vm=new Date();vm.setDate(1);$('#nd').value=sel;render()};

/* Tambah tugas */
$('#add').onclick=()=>{
  const title=$('#nt').value.trim();
  if(!title){$('#nt').focus();return}
  S.tasks.push({id:Date.now(),title,type:$('#ntype').value,date:$('#nd').value||sel,dur:Math.max(5,+$('#ndur').value||30),prog:0});
  $('#nt').value='';
  sel=S.tasks[S.tasks.length-1].date;
  const d=new Date(sel+'T00:00');vm=new Date(d.getFullYear(),d.getMonth(),1);
  save();render();
};
$('#nt').onkeydown=e=>{if(e.key==='Enter')$('#add').click()};

/* Daftar tugas */
function render(){
  renderCal();
  const dayTasks=S.tasks.filter(t=>t.date===sel);
  const done=dayTasks.filter(t=>t.prog===100).length;
  const avg=dayTasks.length?Math.round(dayTasks.reduce((a,t)=>a+t.prog,0)/dayTasks.length):0;
  $('#dt').textContent=new Date(sel+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  $('#ds').textContent=dayTasks.length?`${done} dari ${dayTasks.length} tugas selesai · progres rata-rata ${avg}%`:'Belum ada tugas di hari ini';
  const db=$('#dbar');db.firstElementChild.style.width=(dayTasks.length?done/dayTasks.length*100:0)+'%';
  db.classList.toggle('ok',dayTasks.length>0&&done===dayTasks.length);

  let L=$('#fscope').value==='all'?[...S.tasks]:dayTasks;
  const st=$('#fstat').value, ty=$('#ftype').value, so=$('#sort').value;
  if(st==='done')L=L.filter(t=>t.prog===100);
  if(st==='todo')L=L.filter(t=>t.prog<100);
  if(ty)L=L.filter(t=>t.type===ty);
  const cmp={date:(a,b)=>a.date.localeCompare(b.date),dur:(a,b)=>b.dur-a.dur,prog:(a,b)=>b.prog-a.prog,title:(a,b)=>a.title.localeCompare(b.title),type:(a,b)=>a.type.localeCompare(b.type)};
  L.sort(cmp[so]);
  $('#list').innerHTML=L.length?L.map(t=>`
  <div class="t${t.prog===100?' done':''}" style="--c:${COL[t.type]}" data-id="${t.id}">
    <input type="checkbox" ${t.prog===100?'checked':''} aria-label="Selesai">
    <div><div class="ti">${esc(t.title)}</div>
      <div class="meta"><span class="badge">${t.type}</span>${t.dur} menit · ${new Date(t.date+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short'})}</div></div>
    <div class="acts"><button class="btn" data-a="edit" title="Edit tugas">✎</button><button class="btn" data-a="rest" title="Mulai alarm istirahat">⏰</button><button class="btn" data-a="del" title="Hapus">✕</button></div>
    <div class="pg"><div class="bar${t.prog===100?' ok':''}"><b style="width:${t.prog}%"></b></div><span>${t.prog}%</span>
      <input type="range" min="0" max="100" step="5" value="${t.prog}" aria-label="Progres tugas" style="grid-column:1/-1"></div>
  </div>`).join(''):'<div class="empty">Tidak ada tugas yang cocok. Tambahkan lewat form di kiri.</div>';
}
const task=el=>S.tasks.find(t=>t.id==el.closest('.t').dataset.id);
$('#list').addEventListener('change',e=>{
  if(e.target.type==='checkbox'){task(e.target).prog=e.target.checked?100:0;save();render()}
});
$('#list').addEventListener('input',e=>{
  if(e.target.type==='range'){
    const t=task(e.target);t.prog=+e.target.value;
    const box=e.target.closest('.t');
    box.querySelector('.bar b').style.width=t.prog+'%';
    box.querySelector('.pg span').textContent=t.prog+'%';
  }
});
$('#list').addEventListener('pointerup',e=>{if(e.target.type==='range'){save();render()}});
$('#list').addEventListener('keyup',e=>{if(e.target.type==='range'){save();render()}});
$('#list').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const t=task(b);
  if(b.dataset.a==='del'){S.tasks=S.tasks.filter(x=>x.id!==t.id);save();render()}
  else if(b.dataset.a==='edit')openEdit(t);
  else startAlarm(t.title);
});
['#fscope','#fstat','#ftype','#sort'].forEach(s=>$(s).onchange=render);

/* Alarm istirahat */
let endAt=0,tick=null,label='',actx=null;
function startAlarm(name){
  const m=Math.max(1,+$('#am').value||5);
  if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  endAt=Date.now()+m*60000;label=name||'';
  $('#albl').textContent=name?`Istirahat setelah: ${name}`:'Istirahat berjalan';
  $('#astop').disabled=false;
  clearInterval(tick);tick=setInterval(upd,500);upd();
}
function upd(){
  const left=Math.max(0,endAt-Date.now());
  $('#cd').textContent=pad(Math.floor(left/60000))+':'+pad(Math.floor(left/1000)%60);
  if(left<=0)fire();
}
function stopAlarm(){clearInterval(tick);tick=null;$('#cd').textContent='--:--';$('#albl').textContent='Belum ada alarm aktif';$('#astop').disabled=true}
function beep(){
  if(!actx)return;
  [0,.35,.7].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();
    o.frequency.value=880;o.connect(g);g.connect(actx.destination);
    g.gain.setValueAtTime(.25,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d+.3);
    o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.3)});
}
let ringTimer=null;
function fire(){
  stopAlarm();
  $('#rmsg').textContent=label?`Saatnya kembali ke: ${label}`:'Saatnya kembali bekerja.';
  $('#ring').classList.add('on');
  beep();ringTimer=setInterval(beep,2000);
  try{if(Notification.permission==='granted')new Notification('Waktu istirahat habis',{body:$('#rmsg').textContent})}catch(e){}
}
$('#rok').onclick=()=>{clearInterval(ringTimer);$('#ring').classList.remove('on')};
$('#astart').onclick=()=>startAlarm('');
$('#astop').onclick=stopAlarm;

$('#nd').value=sel;
/* Edit tugas */
let eid=null;
function closeEdit(){$('#edit').classList.remove('on')}
function openEdit(t){eid=t.id;$('#et').value=t.title;$('#etype').value=t.type;$('#edur').value=t.dur;$('#ed').value=t.date;$('#edit').classList.add('on');$('#et').focus()}
$('#esave').onclick=()=>{
  const t=S.tasks.find(x=>x.id===eid),v=$('#et').value.trim();
  if(!t||!v){$('#et').focus();return}
  t.title=v;t.type=$('#etype').value;t.dur=Math.max(5,+$('#edur').value||30);t.date=$('#ed').value||t.date;
  sel=t.date;const d=new Date(sel+'T00:00');vm=new Date(d.getFullYear(),d.getMonth(),1);$('#nd').value=sel;
  closeEdit();save();render();
};
$('#ecancel').onclick=closeEdit;
$('#edit').addEventListener('keydown',e=>{if(e.key==='Escape')closeEdit();if(e.key==='Enter'&&e.target.tagName==='INPUT')$('#esave').click()});
applyTheme();render();
</script>
</body>
</html>
